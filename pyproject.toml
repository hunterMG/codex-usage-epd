[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-usage-epd"
dynamic = ["version"]
description = "Push OpenAI Codex usage quota to a 4.2\" 400x300 three-colour e-paper display over BLE"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "jon" }]
keywords = ["epd", "e-paper", "ble", "codex", "usage", "display"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
  "bleak>=0.21",
  "Pillow>=10",
  "requests>=2.31",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
codex-usage-epd = "codex_usage_epd.cli:main"

[tool.hatch.version]
path = "codex_usage_epd/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["codex_usage_epd"]
force-include = { "config/codex_usage_epd.yaml.example" = "codex_usage_epd/codex_usage_epd.yaml.example" }