name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Check release tag matches package version
        run: |
          version="$(python -c 'from codex_usage_epd import __version__; print(__version__)')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$version" ]; then
            echo "Release tag v$tag_version does not match package version $version" >&2
            exit 1
          fi
      - name: Build distributions
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/codex-usage-epd
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1
